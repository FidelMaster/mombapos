es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d de %b"
      long: "%d de %B de %Y"
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    # El primer elemento '~' (null) es obligatorio porque los meses en Ruby van del índice 1 al 12
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %I:%M %p"
      short: "%d/%m %I:%M %p"
      long: "%d de %B de %Y a las %I:%M %p"
      ticket: "%d/%m/%Y %I:%M %p"
    am: "AM"
    pm: "PM"

  number:
    format:
      separator: "."
      delimiter: ","
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        unit: "C$"
        format: "%u%n"
        separator: "."
        delimiter: ","
        precision: 2
    percentage:
      format:
        delimiter: ","
        format: "%n%"

  # Traducciones útiles para el flujo de facturación
  invoices:
    payment_methods:
      cash: "Efectivo"
      card: "Tarjeta de Crédito / Débito"
      transfer: "Transferencia Bancaria"
      credit: "Crédito"
    statuses:
      paid: "Pagada"
      pending: "Pendiente"
      annulled: "Anulada"